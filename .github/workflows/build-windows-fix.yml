name: Build Windows (TTS fix)

# 只为验证「连续朗读重念整页」这个修复而构建 Windows 包。
# 与仓库自带的 release.yml 的区别：
#   - 只跑 windows-latest，不跑 macOS / Linux，省时间
#   - 不签名 updater 产物（fork 上没有 TAURI_SIGNING_PRIVATE_KEY），产物作为 workflow artifact 下载
#   - 不跑 android / create-updater-json 两个需要额外 secrets 的 job

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tts-continue-repeat

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/app/src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      # tauri.conf.json 里的 beforeBuildCommand 会顺带执行
      # `pnpm --filter @readany/cli build && pnpm build`，
      # 也就是 tsc + vite build —— 补丁能否通过类型检查在这一步见分晓。
      - name: Build Tauri app (Windows, unsigned)
        run: pnpm --filter app tauri build

      - name: List bundle output
        run: Get-ChildItem -Recurse packages/app/src-tauri/target/release/bundle | Select-Object FullName

      - name: Upload installer and binary
        uses: actions/upload-artifact@v4
        with:
          name: ReadAny-windows-tsxfix
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
            packages/app/src-tauri/target/release/*.exe
